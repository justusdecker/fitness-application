<script src ="{{ url_for('static', filename='game/play_card.js') }}"></script>
<div class="card">
    <div class="all-play-cards">
        {% for card in PERSON.cards %}
        {% set cardData = card.todict() %}
        <script>
           document
           .querySelector(".all-play-cards")
           .innerHTML += showPlayCard({{ cardData | tojson }});
        </script>
        {% endfor %}
    </div>
</div>

<script src ="{{ url_for('static', filename='game/pct.js') }}"></script>
